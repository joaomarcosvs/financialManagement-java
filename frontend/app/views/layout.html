<div class="min-h-screen bg-gradient-to-b from-[#06140f] to-black text-gray-300 md:flex">
    <aside
        ng-class="{'md:w-64': mainVm.sidebarAberta, 'md:w-20': !mainVm.sidebarAberta}"
        class="w-full overflow-hidden border-[#10b981]/20 bg-[#030705] transition-all duration-300 ease-in-out md:min-h-screen md:border-r"
    >
        <div class="flex h-20 items-center px-4" ng-class="{'justify-between': mainVm.sidebarAberta, 'justify-center': !mainVm.sidebarAberta}">
            <div class="flex items-center gap-3 overflow-hidden" ng-show="mainVm.sidebarAberta">
                <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-[#10b981]/10 text-lg text-emerald-400">
                    <i class="fa-solid fa-chart-pie"></i>
                </div>
                <div class="min-w-0">
                    <h1 class="text-xl font-bold tracking-tight text-zinc-100">Financial</h1>
                </div>
            </div>

            <button
                type="button"
                ng-click="mainVm.toggleSidebar()"
                class="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl border border-[#10b981]/10 bg-black/30 text-zinc-300 transition-all duration-300 hover:border-[#10b981]/30 hover:bg-[#10b981]/10 hover:text-emerald-400"
            >
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>

        <nav class="space-y-2 px-3 py-6">
            <a
                ui-sref="app.dashboard"
                ui-sref-active="bg-[#10b981]/10 text-emerald-400"
                class="flex items-center rounded-xl p-3 text-sm font-medium text-zinc-400 transition-all duration-300 hover:bg-[#10b981]/10 hover:text-emerald-400"
                ng-class="{'justify-center': !mainVm.sidebarAberta, 'justify-start gap-3': mainVm.sidebarAberta}"
            >
                <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-black/30 text-emerald-400">
                    <i class="fa-solid fa-chart-line"></i>
                </span>
                <span ng-show="mainVm.sidebarAberta" class="whitespace-nowrap">Dashboard</span>
            </a>
            <a
                ui-sref="app.contas"
                ui-sref-active="bg-[#10b981]/10 text-emerald-400"
                class="flex items-center rounded-xl p-3 text-sm font-medium text-zinc-400 transition-all duration-300 hover:bg-[#10b981]/10 hover:text-emerald-400"
                ng-class="{'justify-center': !mainVm.sidebarAberta, 'justify-start gap-3': mainVm.sidebarAberta}"
            >
                <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-black/30 text-emerald-400">
                    <i class="fa-solid fa-wallet"></i>
                </span>
                <span ng-show="mainVm.sidebarAberta" class="whitespace-nowrap">Contas</span>
            </a>
            <a
                ui-sref="app.extrato"
                ui-sref-active="bg-[#10b981]/10 text-emerald-400"
                class="flex items-center rounded-xl p-3 text-sm font-medium text-zinc-400 transition-all duration-300 hover:bg-[#10b981]/10 hover:text-emerald-400"
                ng-class="{'justify-center': !mainVm.sidebarAberta, 'justify-start gap-3': mainVm.sidebarAberta}"
            >
                <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-black/30 text-emerald-400">
                    <i class="fa-solid fa-receipt"></i>
                </span>
                <span ng-show="mainVm.sidebarAberta" class="whitespace-nowrap">Extrato</span>
            </a>
        </nav>
    </aside>

    <div class="flex min-h-screen flex-1 flex-col">
        <header class="h-20 bg-transparent px-6 md:px-8">
            <div class="relative flex h-full items-center justify-end gap-4">

                <div>
                    <button
                        type="button"
                        ng-click="mainVm.toggleMenu()"
                        class="flex h-12 w-12 items-center justify-center rounded-full border border-[#10b981]/20 bg-black/30 text-sm font-bold tracking-[0.2em] text-emerald-300 transition hover:border-[#10b981]/40 hover:bg-[#10b981]/10"
                    >
                        {{ mainVm.usuario.iniciais }}
                    </button>

                    <div ng-if="mainVm.menuAberto" class="absolute right-0 top-16 z-50 w-48 rounded-xl border border-[#10b981]/10 bg-[#050a08] shadow-2xl">
                        <div class="border-b border-[#10b981]/10 px-4 py-3">
                            <p class="text-sm font-semibold text-zinc-100">{{ mainVm.usuario.nome }}</p>
                            <p class="mt-1 text-xs uppercase tracking-[0.2em] text-emerald-400">Conta ativa</p>
                        </div>

                        <div class="p-2">
                            <a
                                ui-sref="app.perfil"
                                ng-click="mainVm.menuAberto = false"
                                class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left text-sm text-zinc-300 transition hover:bg-zinc-900 hover:text-zinc-100"
                            >
                                <i class="fa-regular fa-user text-emerald-400"></i>
                                Perfil
                            </a>
                            <button
                                type="button"
                                class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left text-sm text-zinc-300 transition hover:bg-zinc-900 hover:text-zinc-100"
                            >
                                <i class="fa-solid fa-gear text-emerald-400"></i>
                                Configurações
                            </button>
                            <button
                                type="button"
                                ng-click="mainVm.logout()"
                                class="mt-2 flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left text-sm font-medium text-rose-400 transition hover:bg-rose-500/10 hover:text-rose-300"
                            >
                                <i class="fa-solid fa-right-from-bracket"></i>
                                Logout
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <main class="flex-1 px-6 pb-8 pt-4 md:px-8">
            <div ui-view></div>
        </main>
    </div>
</div>
